services:
  warp:
    image: caomingjun/warp:2026.7.1377.0-2.12.0
    container_name: warp
    restart: unless-stopped
    device_cgroup_rules: ["c 10:200 rwm"]
    cap_add: [MKNOD, AUDIT_WRITE, NET_ADMIN]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv4.conf.all.src_valid_mark: 1
    environment:
      WARP_SLEEP: 2
    ports: ["127.0.0.1:1080:1080"]
    volumes:
      - ${CONFIG_DIR}/warp:/var/lib/cloudflare-warp
    labels:
      autoheal: "true"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    depends_on:
      warp: { condition: service_healthy }
    environment:
      TZ: ${TZ}
      HTTP_PROXY: http://warp:1080
      HTTPS_PROXY: http://warp:1080
      NO_PROXY: localhost,127.0.0.1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      start_period: 30s

  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: autoheal
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  tsdproxy:
    image: almeidapaulopt/tsdproxy:2.3.4
    container_name: tsdproxy
    restart: unless-stopped
    ports: ["127.0.0.1:8088:8080"]
    secrets: [ts_authkey]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./network/tsdproxy.yaml:/config/tsdproxy.yaml:ro
      - ${CONFIG_DIR}/tsdproxy:/data
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: tsdproxy
      tsdproxy.port.1: 443/https:8080/http
      homepage.group: Infra
      homepage.name: TSDProxy
      homepage.icon: tailscale.png
      homepage.href: https://tsdproxy.${TAILNET}

secrets:
  ts_authkey:
    environment: TS_AUTHKEY
