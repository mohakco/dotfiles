- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: "{{HOMEPAGE_VAR_JELLYFIN_PUBLIC_URL}}"
        widget:
          type: jellyfin
          url: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
          key: "{{HOMEPAGE_FILE_JELLYFIN_KEY}}"
          version: 2
          enableBlocks: true
          enableNowPlaying: true
