services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
    container_name: qbittorrent
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881
    ports: ["127.0.0.1:8080:8080", "6881:6881", "6881:6881/udp"]
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - { type: bind, source: "${DATA_DIR}", target: /data, bind: { create_host_path: false } }
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: qbit
      tsdproxy.port.1: 443/https:8080/http
      homepage.group: Downloads
      homepage.name: qBittorrent
      homepage.icon: qbittorrent.png
      homepage.href: https://qbit.${TAILNET}
      homepage.widget.type: qbittorrent
      homepage.widget.url: http://qbittorrent:8080
      homepage.widget.username: ${ADMIN_USER}
      homepage.widget.password: ${ADMIN_PASSWORD:?run via make}
