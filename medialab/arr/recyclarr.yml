sonarr:
  sonarr:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    quality_definition:
      type: series
      qualities:
        - { name: HDTV-720p, min: !env_var MIN_MB_PER_MIN, preferred: !env_var PREFERRED_MB_PER_MIN, max: !env_var MAX_MB_PER_MIN }
        - { name: WEBRip-720p, min: !env_var MIN_MB_PER_MIN, preferred: !env_var PREFERRED_MB_PER_MIN, max: !env_var MAX_MB_PER_MIN }
        - { name: WEBDL-720p, min: !env_var MIN_MB_PER_MIN, preferred: !env_var PREFERRED_MB_PER_MIN, max: !env_var MAX_MB_PER_MIN }
        - { name: Bluray-720p, min: !env_var MIN_MB_PER_MIN, preferred: !env_var PREFERRED_MB_PER_MIN, max: !env_var MAX_MB_PER_MIN }
        - { name: HDTV-1080p, min: !env_var MIN_MB_PER_MIN, preferred: !env_var PREFERRED_MB_PER_MIN, max: !env_var MAX_MB_PER_MIN }
        - { name: WEBRip-1080p, min: !env_var MIN_MB_PER_MIN, preferred: !env_var PREFERRED_MB_PER_MIN, max: !env_var MAX_MB_PER_MIN }
        - { name: WEBDL-1080p, min: !env_var MIN_MB_PER_MIN, preferred: !env_var PREFERRED_MB_PER_MIN, max: !env_var MAX_MB_PER_MIN }
        - { name: Bluray-1080p, min: !env_var MIN_MB_PER_MIN, preferred: !env_var PREFERRED_MB_PER_MIN, max: !env_var MAX_MB_PER_MIN }
        - { name: Bluray-1080p Remux, min: !env_var MIN_MB_PER_MIN, preferred: !env_var PREFERRED_MB_PER_MIN, max: !env_var MAX_MB_PER_MIN }
    quality_profiles:
      - name: HD-1080p
        upgrade:
          allowed: false
    custom_formats:
      - trash_ids: [47435ece6b99a0b477caf360e79ba0bb]
        assign_scores_to:
          - name: HD-1080p
            score: 100

